<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor Certyfikatów TLS</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: #1e293b;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        h1 {
            margin-top: 0;
            color: #38bdf8;
            font-size: 1.75rem;
        }

        #status {
            padding: 0.75rem 1rem;
            border-radius: 6px;
            background: #334155;
            color: #cbd5e1;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        th,
        td {
            padding: 12px 14px;
            text-align: left;
            border-bottom: 1px solid #334155;
        }

        th {
            background-color: #0f172a;
            color: #94a3b8;
            font-size: 0.85rem;
            text-transform: uppercase;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .badge-valid {
            background-color: rgba(34, 197, 94, 0.2);
            color: #4ade80;
        }

        .badge-warning {
            background-color: rgba(234, 179, 8, 0.2);
            color: #facc15;
        }

        .badge-expired {
            background-color: rgba(239, 68, 68, 0.2);
            color: #f87171;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Monitor Certyfikatów TLS</h1>
        <div id="status">Pobieranie certyfikatów z backendu...</div>

        <table id="certTable" style="display: none;">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Domena</th>
                    <th>Ważny do</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="certList"></tbody>
        </table>
    </div>

    <script>
        fetch('/api/certificates')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Błąd HTTP ' + response.status);
                }
                return response.json();
            })
            .then(data => {
                const statusEl = document.getElementById('status');
                statusEl.textContent = 'Pomyślnie pobrano ' + data.length + ' certyfikat(ów) z backendu (JSON):';
                statusEl.style.color = '#4ade80';

                const tbody = document.getElementById('certList');
                tbody.innerHTML = '';

                data.forEach(item => {
                    const tr = document.createElement('tr');
                    const badgeClass = item.status === 'valid' ? 'badge-valid' : (item.status === 'warning' ? 'badge-warning' : 'badge-expired');
                    tr.innerHTML = `
                        <td>${item.id}</td>
                        <td><strong>${item.domain}</strong></td>
                        <td>${item.valid_until}</td>
                        <td><span class="badge ${badgeClass}">${item.status}</span></td>
                    `;
                    tbody.appendChild(tr);
                });

                document.getElementById('certTable').style.display = 'table';
            })
            .catch(error => {
                const statusEl = document.getElementById('status');
                statusEl.textContent = 'Błąd pobierania danych: ' + error.message;
                statusEl.style.color = '#f87171';
            });
    </script>
</body>

</html>
