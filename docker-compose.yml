services:
  backend:
    build: ./backend
    restart: unless-stopped
    ports: ["8000:8000"]
    environment:
      - DATABASE_URL=postgresql://certuser:${POSTGRES_PASSWORD}@db:5432/certificates
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  frontend:
    build: ./frontend
    ports: [ "8080:80" ]
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=certuser
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?brak pliku .env}
      - POSTGRES_DB=certificates
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "certuser", "-d", "certificates" ]
      interval: 2s
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
