services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://certuser:${POSTGRES_PASSWORD}@db:5432/certificates
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports: [ "8080:80" ]
    restart: unless-stopped
    depends_on:
      - backend

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=certuser
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?brak pliku .env}
      - POSTGRES_DB=certificates
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "certuser" ]
      interval: 2s
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
